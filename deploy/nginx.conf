worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 24M;  # >= post_max_size (24M) di php.ini; upload_max_filesize 20M

    log_format main '$remote_addr - $status "$request" $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    upstream php-fpm {
        server app:9000;
    }

    server {
        listen 80;
        server_name _;

        # Paksa HTTPS. Blok ini dinonaktifkan otomatis jika belum ada sertifikat:
        # certbot menambahkan blok 443 sendiri, atau pakai Caddy sebagai ganti.
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/DOMAIN_ANDA/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMAIN_ANDA/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;

        root /var/www/html/public;
        index index.php;

        # Header keamanan dikirim aplikasi (SecurityHeaders middleware).
        # Tambahan pertahanan di level proxy:
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Blokir akses langsung ke file dot (.env, .git, dsb)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Jangan pernah sajikan file dokumen secara langsung — harus lewat controller.
        location ~* ^/storage/.*\.(pdf|doc|docx)$ {
            deny all;
        }

        location ~ \.php$ {
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            fastcgi_read_timeout 60s;
        }

        # Cache aset statis hasil build Vite
        location ~* \.(?:css|js|woff2?|svg|png|jpe?g|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
