; ─────────────────────────────────────────────────────────────────────────────
; PHP-FPM pool — VPS 2 GB RAM
;
; Budget RAM: 3 worker x 192M = 576M maksimum (biasanya jauh lebih kecil,
; PHP rata-rata 40-60M per request). Modal besar untuk MySQL + Nginx + OS.
; ─────────────────────────────────────────────────────────────────────────────
[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.backlog = 128

; 3 worker: cukup untuk traffic pemberkasan kampus (puluhan user bersamaan).
pm = static
pm.max_children = 3
pm.max_requests = 500

; Jangan biarkan request mengantung menghabiskan worker.
request_terminate_timeout = 65s
request_slowlog_timeout = 10s
slowlog = /var/www/html/storage/logs/fpm-slow.log

; Akses & error log ke stdout/stderr agar terbaca `docker compose logs`.
access.log = /proc/self/fd/1
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
