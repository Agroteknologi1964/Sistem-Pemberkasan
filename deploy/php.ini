; ─────────────────────────────────────────────────────────────────────────────
; PHP produksi — VPS 2 GB RAM
; ─────────────────────────────────────────────────────────────────────────────
memory_limit = 192M
max_execution_time = 60
max_input_time = 60

; Upload PDF. HARUS konsisten dengan:
;   .env MAX_FILE_SIZE=20480  (satuan KB)
;   nginx client_max_body_size (lihat deploy/nginx.conf)
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 20

; Jangan bocorkan versi PHP ke header
expose_php = Off

; OPcache — wajib untuk performa di RAM 2 GB
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1

; Timezone & locale
date.timezone = Asia/Jakarta

; Jangan tampilkan error ke user di produksi (log tetap jalan)
display_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log

; Sesi disimpan di file dalam volume agar tidak hilang saat restart
session.gc_maxlifetime = 7200
