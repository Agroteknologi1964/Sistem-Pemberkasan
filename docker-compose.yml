# ─────────────────────────────────────────────────────────────────────────────
# Sistem Pemberkasan — stack produksi
#   app   : PHP-FPM 8.2  (Laravel + Livewire)
#   nginx : reverse proxy + TLS termination
#   db    : MySQL 8 (data persist di volume)
#   redis : session/cache driver (opsional tapi disarankan)
#
# Ukuran RAM yang dibutuhkan (± 1.4 GB dari 2 GB):
#   MySQL   ~ 400 MB   (innodb_buffer_pool_size 128M)
#   PHP-FPM ~ 400 MB   (4 worker x ~100 MB)
#   Nginx   ~ 30 MB
#   Redis   ~ 40 MB
#   OS      ~ 300 MB  → sisakan swap 2 GB untuk aman
# ─────────────────────────────────────────────────────────────────────────────

name: pemberkasan

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pemberkasan-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      LOG_CHANNEL: stderr
    volumes:
      # Dokumen PDF tersimpan di volume — bertahan saat container di-rebuild
      - documents:/var/www/html/storage/app/documents
      - app-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      # Cek port FPM benar-benar menerima koneksi (proses hidup tapi pool mati
      # tetap gagal di sini). start_period memberi waktu entrypoint migrate.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000)?0:1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # Batasi PHP-FPM agar tidak menghabiskan RAM 2 GB
    deploy:
      resources:
        limits:
          memory: 768M
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/var/www/html/public:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      # Route /up adalah health endpoint bawaan Laravel (bootstrap/app.php).
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/up || wget -q --spider http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *default-logging

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: >
      --innodb-buffer-pool-size=128M
      --max-connections=50
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # $$ = escape compose; password dibaca dari env di dalam container,
      # sehingga tidak terlihat di `docker inspect` maupun proses args.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M
    logging: *default-logging

volumes:
  db-data:
  documents:
  redis-data:
  app-logs:

networks:
  backend:
    driver: bridge
